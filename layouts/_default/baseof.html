<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.Title }}</title>
  <meta name="description" content="Working site of the workshop {{ site.Title }}, {{ site.Params.date }}, {{ site.Params.venue }}.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2300204D'/%3E%3Cpath d='M18 4 8 18h7l-2 10 11-15h-7z' fill='%2300B2FF'/%3E%3C/svg%3E">
</head>
<body>
  {{ block "main" . }}{{ end }}
  <script>window.EP = {day: "{{ site.Params.day }}", programme: {{ site.Data.programme | jsonify | safeJS }} };</script>
  <script src="{{ "js/now.js" | relURL }}" defer></script>
</body>
</html>
